# Include this file from the existing Nginx http{} context (for example,
# sites-enabled/*.conf). Replace chess.example.com and use the certificate
# paths already issued for that hostname.
map $http_upgrade $remorse_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream remorse_chess_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name chess.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name chess.example.com;

    ssl_certificate     /etc/letsencrypt/live/chess.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chess.example.com/privkey.pem;

    location / {
        proxy_pass http://remorse_chess_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://remorse_chess_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $remorse_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
