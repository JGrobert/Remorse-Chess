services:
  remorse-chess:
    image: ghcr.io/jgrobert/remorse-chess:latest
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      WEB_DIST_DIR: /app/apps/web/dist
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
